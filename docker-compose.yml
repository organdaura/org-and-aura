version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: org_aura_postgres
    environment:
      POSTGRES_USER: hritish
      POSTGRES_PASSWORD: password
      POSTGRES_DB: org_aura
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
