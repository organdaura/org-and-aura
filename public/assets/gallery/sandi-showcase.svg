<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <linearGradient id="posterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#801826"/>
      <stop offset="60%" stop-color="#4A0E16"/>
      <stop offset="100%" stop-color="#24070B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" rx="32" fill="url(#posterGrad)"/>

  <!-- Left badge: EASWARI STARTUP -->
  <rect x="50" y="50" width="220" height="60" rx="12" fill="#FFFFFF" fill-opacity="0.95"/>
  <text x="160" y="86" text-anchor="middle" fill="#801826" font-family="sans-serif" font-size="16" font-weight="bold">EASWARI STARTUP</text>

  <!-- Side text -->
  <text x="70" y="450" transform="rotate(-90 70 450)" fill="#FFFFFF" fill-opacity="0.3" font-family="sans-serif" font-size="52" font-weight="900" letter-spacing="8">#STARTUP</text>

  <!-- Right: SanDi Unit Diagram Poster -->
  <rect x="420" y="140" width="320" height="420" rx="20" fill="#FFFFFF"/>
  <rect x="440" y="160" width="280" height="40" rx="8" fill="#F4EFE5"/>
  <text x="580" y="185" text-anchor="middle" fill="#254130" font-family="sans-serif" font-size="16" font-weight="bold">SanDi REVOLUTION</text>

  <!-- Internal mechanism tiers -->
  <rect x="440" y="220" width="280" height="240" rx="12" fill="#F9FBF9" stroke="#BCD4C1" stroke-width="1.5"/>
  <rect x="460" y="240" width="240" height="30" rx="6" fill="#DEEAE0"/>
  <text x="475" y="260" fill="#254130" font-family="sans-serif" font-size="11">Gas Treatment Activated Carbon</text>
  <rect x="460" y="280" width="240" height="30" rx="6" fill="#F4EFE5"/>
  <text x="475" y="300" fill="#254130" font-family="sans-serif" font-size="11">PTC Heater Core Unit</text>
  <rect x="460" y="320" width="240" height="30" rx="6" fill="#DEEAE0"/>
  <text x="475" y="340" fill="#254130" font-family="sans-serif" font-size="11">Automated Disposal Hatch</text>

  <!-- Left Mini installation preview cards -->
  <g stroke="#D4AF37" stroke-width="2">
    <rect x="180" y="180" width="160" height="100" rx="10" fill="#FFFFFF"/>
    <rect x="220" y="300" width="160" height="100" rx="10" fill="#FFFFFF"/>
    <rect x="180" y="420" width="160" height="100" rx="10" fill="#FFFFFF"/>
    
    <!-- Arrows connecting -->
    <line x1="340" y1="230" x2="420" y2="230"/>
    <line x1="380" y1="350" x2="420" y2="350"/>
    <line x1="340" y1="470" x2="420" y2="470"/>
  </g>

  <!-- Bottom founders banner -->
  <rect x="50" y="580" width="700" height="170" rx="24" fill="#FFFFFF" fill-opacity="0.95"/>
  <circle cx="160" cy="665" r="45" fill="#3D684C"/>
  <circle cx="270" cy="665" r="45" fill="#3D684C"/>
  <text x="400" y="650" fill="#18221C" font-family="serif" font-size="22" font-weight="bold">ORG &amp; AURA FOUNDATION</text>
  <text x="400" y="680" fill="#4F7C5A" font-family="sans-serif" font-size="14">Invented &amp; Incubated at Easwari Engineering College</text>
</svg>
