<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" fill="none" class="w-full h-auto">
  <defs>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8DB695" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#4A7555" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5C7AC" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#5D8B69" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="leafGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BCD8C2" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#739F7E" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Left foliage cluster -->
  <g opacity="0.85">
    <!-- Branch stem -->
    <path d="M-40 -20 Q120 40 280 150" stroke="#5D8B69" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- Leaves left -->
    <path d="M10 20 C30 5 80 10 100 40 C70 50 30 45 10 20 Z" fill="url(#leafGrad1)"/>
    <path d="M60 40 C95 20 145 35 155 70 C125 75 85 65 60 40 Z" fill="url(#leafGrad2)"/>
    <path d="M120 70 C160 50 210 70 215 110 C180 115 140 100 120 70 Z" fill="url(#leafGrad1)"/>
    <path d="M170 100 C210 85 260 110 260 150 C225 150 190 130 170 100 Z" fill="url(#leafGrad3)"/>
    <path d="M40 70 C50 100 80 130 115 125 C110 95 85 80 40 70 Z" fill="url(#leafGrad2)"/>
    <path d="M90 110 C105 145 140 170 170 160 C160 130 130 115 90 110 Z" fill="url(#leafGrad1)"/>
    <!-- Floating subtle leaves -->
    <path d="M-10 80 C15 70 45 85 45 110 C20 115 -5 100 -10 80 Z" fill="url(#leafGrad3)"/>
    <path d="M220 130 C245 120 280 135 275 165 C250 165 230 150 220 130 Z" fill="url(#leafGrad2)"/>
  </g>

  <!-- Right foliage cluster -->
  <g opacity="0.85" transform="translate(1200, 0) scale(-1, 1)">
    <!-- Branch stem -->
    <path d="M-40 -20 Q120 40 280 150" stroke="#5D8B69" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- Leaves right -->
    <path d="M10 20 C30 5 80 10 100 40 C70 50 30 45 10 20 Z" fill="url(#leafGrad1)"/>
    <path d="M60 40 C95 20 145 35 155 70 C125 75 85 65 60 40 Z" fill="url(#leafGrad2)"/>
    <path d="M120 70 C160 50 210 70 215 110 C180 115 140 100 120 70 Z" fill="url(#leafGrad1)"/>
    <path d="M170 100 C210 85 260 110 260 150 C225 150 190 130 170 100 Z" fill="url(#leafGrad3)"/>
    <path d="M40 70 C50 100 80 130 115 125 C110 95 85 80 40 70 Z" fill="url(#leafGrad2)"/>
    <path d="M90 110 C105 145 140 170 170 160 C160 130 130 115 90 110 Z" fill="url(#leafGrad1)"/>
    <path d="M220 130 C245 120 280 135 275 165 C250 165 230 150 220 130 Z" fill="url(#leafGrad3)"/>
  </g>
</svg>
