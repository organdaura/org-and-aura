<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
    <defs>
      <linearGradient id="bgGrad_RA" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F4EFE5"/>
        <stop offset="100%" stop-color="#E0ECE2"/>
      </linearGradient>
    </defs>
    <rect width="400" height="480" rx="28" fill="url(#bgGrad_RA)" stroke="#DEEAE0" stroke-width="2"/>
    
    <!-- Silhouette Avatar Backdrop -->
    <circle cx="200" cy="190" r="90" fill="#FFFFFF" stroke="#4F7C5A" stroke-width="3"/>
    
    <!-- Initials Emblem -->
    <text x="200" y="205" text-anchor="middle" fill="#3D684C" font-family="serif" font-size="44" font-weight="bold">RA</text>
    
    <!-- Badge -->
    <rect x="130" y="305" width="140" height="28" rx="14" fill="#3D684C"/>
    <text x="200" y="324" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">RESEARCH</text>

    <!-- Name & Role -->
    <text x="200" y="375" text-anchor="middle" fill="#18221C" font-family="serif" font-size="20" font-weight="bold">Research Associate</text>
    <text x="200" y="405" text-anchor="middle" fill="#4F7C5A" font-family="sans-serif" font-size="13">Thermal Research</text>
  </svg>