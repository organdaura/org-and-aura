<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4EFE5"/>
    </linearGradient>
    <linearGradient id="chamberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D684C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3D684C" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Outer chassis frame -->
  <rect x="100" y="80" width="400" height="640" rx="32" fill="url(#chassisGrad)" stroke="#3D684C" stroke-width="4"/>

  <!-- Top Sensor & Indicator Banner -->
  <rect x="140" y="110" width="320" height="50" rx="12" fill="#E0ECE2" stroke="#4F7C5A" stroke-width="1.5"/>
  <circle cx="170" cy="135" r="8" fill="#4F7C5A"/>
  <text x="195" y="141" fill="#254130" font-family="sans-serif" font-size="14" font-weight="bold">SanDi SMART INDUCTION</text>
  <rect x="410" y="127" width="35" height="16" rx="8" fill="#4F7C5A"/>

  <!-- Contactless Deposit Aperture -->
  <rect x="140" y="190" width="320" height="150" rx="20" fill="url(#chamberGrad)" stroke="#4F7C5A" stroke-width="2"/>
  <rect x="160" y="210" width="280" height="110" rx="14" fill="#FFFFFF" stroke="#BCD4C1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="300" y="260" text-anchor="middle" fill="#4F7C5A" font-family="sans-serif" font-size="14" font-weight="bold">AUTOMATED DEPOSIT PORT</text>
  <text x="300" y="280" text-anchor="middle" fill="#6B9B75" font-family="sans-serif" font-size="11">Infrared Contactless Induction</text>

  <!-- Technical Chamber Architecture -->
  <rect x="140" y="370" width="320" height="230" rx="16" fill="#FBF8F2" stroke="#4F7C5A" stroke-width="1.5"/>
  
  <!-- Multi-tier filters -->
  <rect x="160" y="390" width="280" height="35" rx="8" fill="#DEEAE0" stroke="#6B9B75" stroke-width="1"/>
  <text x="175" y="412" fill="#254130" font-family="sans-serif" font-size="11" font-weight="bold">STAGE 1: HEPA / Catalytic Filter Bank</text>

  <rect x="160" y="435" width="280" height="50" rx="8" fill="#FFFFFF" stroke="#3D684C" stroke-width="1.5"/>
  <text x="175" y="457" fill="#254130" font-family="sans-serif" font-size="11" font-weight="bold">STAGE 2: Rapid Thermal Pyrolysis Chamber</text>
  <text x="175" y="473" fill="#6B9B75" font-family="sans-serif" font-size="10">Ceramic Heating Core &bull; Flameless &bull; Zero Emission</text>

  <rect x="160" y="495" width="280" height="35" rx="8" fill="#DEEAE0" stroke="#6B9B75" stroke-width="1"/>
  <text x="175" y="517" fill="#254130" font-family="sans-serif" font-size="11" font-weight="bold">STAGE 3: Activated Charcoal Deodorizer</text>

  <rect x="160" y="540" width="280" height="40" rx="8" fill="#F4EFE5" stroke="#BCD4C1" stroke-width="1"/>
  <text x="175" y="565" fill="#254130" font-family="sans-serif" font-size="11" font-weight="bold">STAGE 4: Hermetic Ash Collection Crucible</text>

  <!-- Dimensions & callouts -->
  <line x1="70" y1="80" x2="70" y2="720" stroke="#739F7E" stroke-width="1.5"/>
  <text x="60" y="405" text-anchor="middle" transform="rotate(-90 60 405)" fill="#4F7C5A" font-family="sans-serif" font-size="12">850 mm HEIGHT</text>

  <line x1="100" y1="740" x2="500" y2="740" stroke="#739F7E" stroke-width="1.5"/>
  <text x="300" y="760" text-anchor="middle" fill="#4F7C5A" font-family="sans-serif" font-size="12">450 mm WIDTH</text>
</svg>
