<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="renderBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F7F4EC"/>
      <stop offset="100%" stop-color="#E8DFD0"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
  </defs>

  <rect x="50" y="50" width="400" height="400" rx="36" fill="#FBF8F2"/>
  <rect x="110" y="80" width="280" height="340" rx="28" fill="url(#renderBody)" stroke="#3D684C" stroke-width="3"/>
  <rect x="110" y="150" width="280" height="6" fill="url(#goldAccent)"/>

  <!-- Display Interface -->
  <rect x="150" y="105" width="200" height="32" rx="8" fill="#253129"/>
  <text x="250" y="126" text-anchor="middle" fill="#E0ECE2" font-family="sans-serif" font-size="12" letter-spacing="1">SanDi READY &bull; STANDBY</text>

  <!-- Ingestion Hatch -->
  <rect x="140" y="180" width="220" height="110" rx="16" fill="#3D684C" fill-opacity="0.1" stroke="#4F7C5A" stroke-width="2"/>
  <circle cx="250" cy="235" r="30" stroke="#D4AF37" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M240 235 L260 235 M250 225 L250 245" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>

  <!-- Logo Plaque -->
  <text x="250" y="340" text-anchor="middle" fill="#254130" font-family="serif" font-size="16" font-weight="bold">ORG &amp; AURA</text>
  <text x="250" y="358" text-anchor="middle" fill="#6B9B75" font-family="sans-serif" font-size="10" letter-spacing="2">ZERO EMISSION HYGIENE</text>

  <!-- Status LED -->
  <circle cx="250" cy="385" r="5" fill="#4F7C5A"/>
</svg>
